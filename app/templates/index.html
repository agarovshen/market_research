<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Research</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <script src="/static/js/chart.js"></script>
    <script src="/static/js/luxon.min.js"></script>
    <script src="/static/js/chartjs-adapter-luxon.min.js"></script>
    <script src="/static/js/hammer.min.js"></script>
    <script src="/static/js/chartjs-plugin-zoom.min.js"></script>
    <script src="/static/js/chartjs-chart-financial.min.js"></script>
</head>
<body>
    <header>
        <a href="/research" class="file-button">Research workspace</a>
        <div>
            <div>
                <h1>Market Research</h1>
                <p>Quantitative research workspace</p>
            </div>
            <div>
                <form id="import-form">
                    <input id="csv-file" type="file" accept=".csv,.txt">
                    <button type="submit">Import</button>
                    <span id="file-name"></span>
                    <span id="status" role="status" aria-live="polite"></span>
                </form>
            </div>
            <div>
                <label for="instrument">Instrument</label>
                <select id="instrument">
                    <option value="EURUSD">EURUSD</option>
                </select>
                <label for="timeframe">Timeframe</label>
                <select id="timeframe">
                    <option value="M1">M1</option>
                    <option value="M5">M5</option>
                    <option value="M15">M15</option>
                    <option value="H1">H1</option>
                    <option value="H4">H4</option>
                    <option value="D1">D1</option>
                </select>
            </div>
        </div>
    </header>
    <main>
        <section id="dataset-summary" aria-label="Dataset summary">
            <article>
                <h2>Observations</h2>
                <p id="observations">—</p>
            </article>
            <article>
                <h2>Start</h2>
                <p id="start-date">—</p>
            </article>
            <article>
                <h2>End</h2>
                <p id="end-date">—</p>
            </article>
            <article>
                <h2>Last Close</h2>
                <p id="last-close">—</p>
            </article>
            <article>
                <h2>Spread</h2>
                <p id="spread">—</p>
            </article>
        </section>
        <section id="price-analysis" aria-labelledby="price-title">
            <div>
                <h2 id="price-title">Price Analysis</h2>
                <div>
                    <label for="range-slider">Candles: <span id="range-value">1000</span></label>
                    <input id="range-slider" type="range" min="100" max="5000" step="100" value="1000">
                </div>
            </div>
            <div>
                <canvas id="price-chart"></canvas>
            </div>
        </section>
        <section id="market-analysis" aria-label="Market analysis">
            <article id="return-analysis">
                <h2>Return Distribution</h2>
                <div>
                    <canvas id="return-chart"></canvas>
                </div>
            </article>
            <article id="volume-analysis">
                <h2>Volume Analysis</h2>
                <div>
                    <canvas id="volume-chart"></canvas>
                </div>
            </article>
        </section>
        <section id="statistical-metrics" aria-label="Statistical metrics">
            <article>
                <h2>Mean Return</h2>
                <p id="mean-return">—</p>
            </article>
            <article>
                <h2>Volatility</h2>
                <p id="volatility">—</p>
            </article>
            <article>
                <h2>Maximum Drawdown</h2>
                <p id="drawdown">—</p>
            </article>
            <article>
                <h2>Price Range</h2>
                <p id="price-range">—</p>
            </article>
        </section>
    </main>
    <script src="/static/js/app.js"></script>
</body>
</html>
